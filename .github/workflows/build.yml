name: Test and build

# Every push: tests on Linux and Windows and, in parallel, the Windows app (exe, portable ZIP, installer)
# and the Linux app (tar.gz with install.sh) are built and smoke-tested. A tag v<version> (matching
# pyproject.toml) additionally publishes one GitHub release with all of them, but only if all of that passed.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints.txt
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install
        run: python -m pip install -c packaging/constraints.txt -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q

  build-windows:
    name: Windows app (build + smoke test)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints.txt
      - name: Install
        # Not editable: the build bundles the installed package metadata (version for the About dialog).
        run: python -m pip install -c packaging/constraints.txt ".[build]"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build app, portable ZIP and installer
        run: python packaging/build.py
      - name: Smoke test of the built exe
        run: python packaging/smoke_test.py "dist/IFC Converter" --gui
      - name: Previous release (for the update test)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force previous | Out-Null
          gh release download --repo "$env:GITHUB_REPOSITORY" --pattern "IFC-Converter-*-Setup.exe" --dir previous
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::No previous release found, the update test is skipped" }
          exit 0
      - name: Test installer (update, install, refusal while running, Open with, uninstall)
        timeout-minutes: 25
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\IFC-Converter-*-Setup.exe | Select-Object -First 1
          $previous = Get-ChildItem previous\IFC-Converter-*-Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $options = @()
          if ($previous) { $options = @('--previous', $previous.FullName) }
          python packaging/installer_test.py $setup.FullName @options --work installer-test
          exit $LASTEXITCODE
      - name: Setup logs of a failed installer test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-test-logs
          path: installer-test/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: IFC-Converter-windows
          path: |
            dist/IFC-Converter-*-Setup.exe
            dist/IFC-Converter-*-portable.zip
            dist/SHA256SUMS.txt
          retention-days: 7
          compression-level: 0  # installer and ZIP are compressed already

  build-linux:
    name: Linux app (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints.txt
      - name: Qt system libraries
        # What the bundled Qt expects from the system (the smoke test's ldd walk fails on anything missing):
        # OpenGL/EGL, X11's xcb, Wayland client libraries, fontconfig, D-Bus, GLib, xkbcommon.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxcb1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libxcb-shm0 libxcb-glx0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libdrm2 libfontconfig1 libdbus-1-3 libglib2.0-0 desktop-file-utils shared-mime-info
      - name: Install
        # Not editable: the build bundles the installed package metadata (version for the About dialog).
        run: python -m pip install -c packaging/constraints.txt ".[build]"
      - name: Build app and tar.gz
        run: python packaging/build.py
      - name: User guide (PDF, German and English)
        run: QT_QPA_PLATFORM=offscreen python packaging/guide.py
      - name: Smoke test of the built app and the tar.gz
        timeout-minutes: 20
        run: |
          set -euo pipefail
          tarball=$(ls dist/IFC-Converter-*-linux-*.tar.gz)
          python packaging/smoke_test_linux.py dist/ifc-converter --gui --tarball "$tarball"
      - uses: actions/upload-artifact@v7
        with:
          name: IFC-Converter-linux
          path: |
            dist/IFC-Converter-*-linux-*.tar.gz
            dist/IFC-Converter-*-Kurzanleitung.pdf
            dist/SHA256SUMS.txt
          retention-days: 7
          compression-level: 0  # the tar.gz is compressed already

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7  # for CHANGELOG.md and packaging/release_notes.py
      - uses: actions/download-artifact@v8
        with:
          name: IFC-Converter-windows
          path: dist/windows
      - uses: actions/download-artifact@v8
        with:
          name: IFC-Converter-linux
          path: dist/linux
      - name: Collect the files and one SHA256SUMS.txt over all of them
        # Each build's own checksums are verified first (a damaged artifact must not be released).
        run: |
          set -euo pipefail
          (cd dist/windows && sha256sum -c SHA256SUMS.txt)
          (cd dist/linux && sha256sum -c SHA256SUMS.txt)
          mkdir release
          cp dist/windows/IFC-Converter-*-Setup.exe dist/windows/IFC-Converter-*-portable.zip \
             dist/linux/IFC-Converter-*-linux-*.tar.gz dist/linux/IFC-Converter-*-Kurzanleitung.pdf release/
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          test "$(ls release | wc -l)" -eq 5 || { echo "::error::expected Setup.exe, portable ZIP, tar.gz, guide PDF and SHA256SUMS.txt in release/"; ls release; exit 1; }
      - name: Release notes from CHANGELOG.md
        # The newest "## " section (which must be this version's) plus the download line.
        run: |
          set -euo pipefail
          python3 packaging/release_notes.py CHANGELOG.md --version "${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "IFC Converter ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
