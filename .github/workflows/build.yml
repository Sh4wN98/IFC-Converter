name: Test and build

# Every push: tests on Linux and Windows and, in parallel, the Windows app is built and the built exe
# and installer are tested. A tag v<version> (matching pyproject.toml) additionally publishes a GitHub
# release, but only if all of that passed.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints.txt
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install
        run: python -m pip install -c packaging/constraints.txt -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q

  build-windows:
    name: Windows app (build + smoke test)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints.txt
      - name: Install
        # Not editable: the build bundles the installed package metadata (version for the About dialog).
        run: python -m pip install -c packaging/constraints.txt ".[build]"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build app, portable ZIP and installer
        run: python packaging/build.py
      - name: Smoke test of the built exe
        run: python packaging/smoke_test.py "dist/IFC Converter" --gui
      - name: Previous release (for the update test)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force previous | Out-Null
          gh release download --repo "$env:GITHUB_REPOSITORY" --pattern "IFC-Converter-*-Setup.exe" --dir previous
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::No previous release found, the update test is skipped" }
          exit 0
      - name: Test installer (update, install, refusal while running, Open with, uninstall)
        timeout-minutes: 25
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\IFC-Converter-*-Setup.exe | Select-Object -First 1
          $previous = Get-ChildItem previous\IFC-Converter-*-Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $options = @()
          if ($previous) { $options = @('--previous', $previous.FullName) }
          python packaging/installer_test.py $setup.FullName @options --work installer-test
          exit $LASTEXITCODE
      - name: Setup logs of a failed installer test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-test-logs
          path: installer-test/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: IFC-Converter-windows
          path: |
            dist/IFC-Converter-*-Setup.exe
            dist/IFC-Converter-*-portable.zip
            dist/SHA256SUMS.txt
          retention-days: 7
          compression-level: 0  # installer and ZIP are compressed already

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: IFC-Converter-windows
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "IFC Converter ${GITHUB_REF_NAME#v}" \
            --notes "Windows: IFC-Converter-${GITHUB_REF_NAME#v}-Setup.exe installieren (ohne Administratorrechte) oder die portable ZIP entpacken. Prüfsummen in SHA256SUMS.txt."
