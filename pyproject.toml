[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-file-converter"
version = "0.6.2"
description = "Convert IFC building models to 3D formats (glTF/GLB, OBJ, Rhino 3DM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ifcopenshell>=0.8", "rhino3dm>=8", "PySide6-Essentials>=6.6", "numpy"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Windows app: python packaging/build.py (exact versions in packaging/constraints.txt)
build = ["pyinstaller>=6.10"]

[project.scripts]
ifc-convert = "ifc_converter.cli:main"

[project.gui-scripts]
ifc-converter-gui = "ifc_converter.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ifc_converter = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
