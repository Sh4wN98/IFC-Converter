<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- IFC Converter app icon: an isometric building block (the IFC model) and an arrow (converted into
       another format). Flat, three colours. After editing, regenerate icon.png and icon.ico with:
       python tools/make_icon.py -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#2b6cdf"/>
  <!-- Block: top, left and right face, lit from the top left. -->
  <g stroke="#ffffff" stroke-width="7" stroke-linejoin="round">
    <path d="M112 38 L176 75 L112 112 L48 75 Z" fill="#ffffff"/>
    <path d="M48 75 L112 112 L112 186 L48 149 Z" fill="#cfe0fb"/>
    <path d="M176 75 L112 112 L112 186 L176 149 Z" fill="#9dbff3"/>
  </g>
  <!-- Storeys: three floor lines on each side face, so it reads as a building. -->
  <g stroke="#2b6cdf" stroke-width="5" stroke-linecap="round" opacity="0.45">
    <path d="M58 104 L102 129.5 M58 124 L102 149.5 M58 144 L102 169.5"/>
    <path d="M122 129.5 L166 104 M122 149.5 L166 124 M122 169.5 L166 144"/>
  </g>
  <!-- Arrow: converted into another format. -->
  <g fill="none" stroke="#ffb423" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M146 200 L222 200"/>
    <path d="M192 168 L224 200 L192 232"/>
  </g>
</svg>
